# Admin panel configuration.
# Every change saved here is written straight back to the GitHub repository,
# which makes Netlify rebuild and publish the site automatically.

backend:
  name: github
  repo: CrispBlueFlame/solecare-glasgow
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    update: 'Website update: {{collection}}'

# Only takes effect when the site is served from localhost. Lets the admin
# panel be opened and tried against the files on this machine, with no GitHub
# login and no hosting, by clicking "Work with Local Repository".
local_backend: true

site_url: /
display_url: /
publish_mode: simple

media_folder: "src/images"
public_folder: "/images"

collections:
  - name: contact
    label: "Phone number and email"
    files:
      - name: details
        label: "Contact details"
        file: "src/_data/site.json"
        description: "Your phone number and email address. Changing them here updates them everywhere on the website at once."
        fields:
          - { label: "Phone number", name: "phone", widget: "string", hint: "Write it the way you want people to read it, for example 07700 000000" }
          - { label: "Mobile number for texts and WhatsApp", name: "mobile", widget: "string", hint: "The mobile that receives texts. Write it normally, for example 07700 000000" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Opening hours", name: "hours", widget: "string", hint: "For example: Monday to Friday, 9am to 5pm" }
          - { label: "Note under the phone number", name: "phoneNote", widget: "text" }
          - { label: "Note under the text and WhatsApp number", name: "messageNote", widget: "text" }
          - { label: "Note under the email address", name: "emailNote", widget: "text" }
          - { label: "Business name", name: "fullName", widget: "string" }
          - { label: "Name, first part", name: "nameMain", widget: "string", hint: "The large part of the logo, for example Solecare" }
          - { label: "Name, second part", name: "nameSub", widget: "string", hint: "The small part underneath, for example Glasgow East" }
          - { label: "Footer sentence", name: "footerBlurb", widget: "text" }
          - { label: "Footer small print", name: "footerCredit", widget: "string" }

  - name: services
    label: "Services and prices"
    files:
      - name: list
        label: "Services and prices"
        file: "src/_data/services.json"
        description: "Add, remove, reorder or reprice your services. These appear on the home page, the services page, and in the enquiry form."
        fields:
          - label: "Services"
            name: "list"
            widget: "list"
            label_singular: "Service"
            summary: "{{fields.name}} - £{{fields.price}}"
            fields:
              - { label: "Service name", name: "name", widget: "string" }
              - { label: "Price in pounds", name: "price", widget: "string", hint: "Numbers only, no pound sign. For example 45" }
              - { label: "How long it takes", name: "duration", widget: "string", hint: "For example: about 30 minutes" }
              - { label: "Short description, for the home page", name: "short", widget: "text" }
              - label: "Full description, for the services page"
                name: "detail"
                widget: "list"
                label_singular: "Paragraph"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }

  - name: areas
    label: "Areas you visit"
    files:
      - name: list
        label: "Areas you visit"
        file: "src/_data/areas.json"
        description: "The postcodes and places listed on the home page."
        fields:
          - label: "Areas"
            name: "list"
            widget: "list"
            label_singular: "Area"
            summary: "{{fields.code}} - {{fields.places}}"
            fields:
              - { label: "Postcode", name: "code", widget: "string", hint: "For example G69" }
              - { label: "Places in that postcode", name: "places", widget: "string", hint: "Separated by commas, for example: Baillieston, Bargeddie, Garrowhill" }

  - name: about
    label: "About page"
    files:
      - name: page
        label: "About page"
        file: "src/_data/about.json"
        description: "Your own words about who you are. Turn off the yellow reminder box once you have replaced the placeholder text."
        fields:
          - { label: "Show the yellow 'placeholder text' reminder", name: "showPlaceholderNote", widget: "boolean", default: true }
          - { label: "Text inside the yellow reminder", name: "placeholderNote", widget: "text", required: false }
          - { label: "Sentence under the About heading", name: "heroText", widget: "string" }
          - { label: "Your photograph", name: "photo", widget: "image", required: false, hint: "Leave empty to show the grey placeholder box" }
          - { label: "Description of the photograph", name: "photoAlt", widget: "string", required: false, hint: "For people using a screen reader, for example: Jean in her uniform" }
          - label: "Your paragraphs"
            name: "body"
            widget: "list"
            label_singular: "Paragraph"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - { label: "Qualifications heading", name: "qualHeading", widget: "string" }
          - label: "Qualification lines"
            name: "qualLines"
            widget: "list"
            label_singular: "Line"
            field: { label: "Line", name: "line", widget: "text" }

  - name: faqs
    label: "Common questions"
    files:
      - name: list
        label: "Common questions"
        file: "src/_data/faqs.json"
        description: "The questions and answers at the bottom of the enquiry page."
        fields:
          - label: "Questions"
            name: "list"
            widget: "list"
            label_singular: "Question"
            summary: "{{fields.question}}"
            fields:
              - { label: "Question", name: "question", widget: "string" }
              - { label: "Answer", name: "answer", widget: "text" }

  - name: home
    label: "Home page wording"
    files:
      - name: page
        label: "Home page wording"
        file: "src/_data/home.json"
        description: "The headings and introductions on the home page."
        fields:
          - { label: "Main heading", name: "heroHeading", widget: "string" }
          - { label: "Opening paragraph", name: "heroText", widget: "text" }
          - { label: "'What we help with' heading", name: "helpHeading", widget: "string" }
          - { label: "'What we help with' introduction", name: "helpIntro", widget: "text" }
          - { label: "Blue box heading", name: "calloutHeading", widget: "string" }
          - { label: "Blue box text", name: "calloutText", widget: "text" }
          - { label: "'How it works' heading", name: "stepsHeading", widget: "string" }
          - { label: "'How it works' introduction", name: "stepsIntro", widget: "text" }
          - label: "The three steps"
            name: "steps"
            widget: "list"
            label_singular: "Step"
            summary: "{{fields.title}}"
            fields:
              - { label: "Step title", name: "title", widget: "string" }
              - { label: "Step text", name: "text", widget: "text" }
          - { label: "'Areas we visit' heading", name: "areasHeading", widget: "string" }
          - { label: "'Areas we visit' introduction", name: "areasIntro", widget: "text" }
